services:
  db:
    image: postgres:15-alpine
    container_name: ledgerview-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: ledgerview-api
    env_file:
      - .env
    environment:
      # Override to use docker internal network
      - DATABASE_URL=postgresql://ledgerapp:cwA2ex91hxuLX04O@db:5432/ledgerview
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # API URL accessible from the client's browser
        - VITE_API_URL=http://localhost:8000
    container_name: ledgerview-web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
