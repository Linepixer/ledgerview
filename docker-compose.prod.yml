services:
  db:
    image: postgres:15-alpine
    container_name: ledgerview-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: ghcr.io/linepixer/ledgerview-api:latest
    container_name: ledgerview-api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  web:
    image: ghcr.io/linepixer/ledgerview-web:latest
    container_name: ledgerview-web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 ledgerview-api ledgerview-web
    environment:
      - DOCKER_API_VERSION=1.40
    restart: unless-stopped

volumes:
  postgres_data:
